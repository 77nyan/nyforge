[package]
name = "nyforge-gui"
description = "NyForge desktop app: NyFlash, NyBoot and NyFormat"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "nyforge-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
nyforge-core = { path = "../nyforge-core" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
