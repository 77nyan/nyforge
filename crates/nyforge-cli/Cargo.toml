[package]
name = "nyforge"
description = "NyForge command line: flash, clone, NyBoot multiboot, Windows media"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "nyforge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
ctrlc = "3.5.2"
libc = "0.2.191"
nyforge-core = { path = "../nyforge-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
