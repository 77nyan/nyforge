name: Release

# Push a tag like v0.1.0 to build the three downloads (Linux, macOS, Windows) and publish them as a
# GitHub release. "Run workflow" from the Actions tab builds everything without publishing, which is
# the way to try this out first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Tag and Cargo.toml must agree, otherwise the files would carry the wrong version.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $ver"; exit 1; }

  # Download 1: Linux. The desktop app and the command line, built on Ubuntu 22.04 so it runs on
  # Ubuntu 22.04+, Debian 12+, Fedora 36+ and other distros with glibc 2.35 or newer.
  linux:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: tools/package-unix.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "dist/*.tar.gz*" }

  # Extra Linux downloads: command line only, for older distros, ARM64 and Alpine.
  linux-cli:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu.2.17
          - aarch64-unknown-linux-gnu.2.17
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install ziglang cargo-zigbuild
      - run: tools/package-unix.sh --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with: { name: "linux-cli-${{ matrix.target }}", path: "dist/*.tar.gz*" }

  # Download 2: macOS. NyForge.app plus the command line, one build for Apple Silicon and Intel.
  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/package-unix.sh --macos-universal
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "dist/*.tar.gz*" }

  # Download 3: Windows. nyforge-gui.exe (the app) and nyforge.exe (the command line).
  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p nyforge -p nyforge-gui
      - name: Zip
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $name = "nyforge-$ver-windows-x86_64"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item target/release/nyforge.exe, target/release/nyforge-gui.exe, install.ps1, install.cmd, LICENSE, README.md, THIRD-PARTY.md "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File "dist/$name.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/*.zip*" }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-cli, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: "out/*"
          generate_release_notes: true
