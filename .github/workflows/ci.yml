name: CI
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config dosfstools exfatprogs ntfs-3g e2fsprogs parted mtools util-linux
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --workspace
      - run: cargo test --locked -p nyforge-core -p nyforge
      - name: Format tests (need the checking tools)
        run: |
          cargo test --locked -p nyforge-core usbformat -- --ignored --skip a_real_block_device
      - name: Installer works from a clone
        run: |
          ./install.sh --user
          ~/.local/bin/nyforge --version
          test -x ~/.local/bin/nyforge-gui
          test -f ~/.local/share/applications/nyforge.desktop
          grep -q "Exec=$HOME/.local/bin/nyforge-gui" ~/.local/share/applications/nyforge.desktop

  # Apple Silicon runner. This is the first place the macOS code is compiled and run for real,
  # and `list` / `doctor` exercise the real `diskutil` on a real Mac.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --workspace
      - run: cargo test --locked -p nyforge-core -p nyforge
      - name: Drive detection on a real Mac
        run: |
          ./target/debug/nyforge --version
          ./target/debug/nyforge doctor
          ./target/debug/nyforge list --all
          ./target/debug/nyforge list --all --json
      - name: Intel build compiles (cross-compiled from Apple Silicon)
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --locked -p nyforge -p nyforge-gui --target x86_64-apple-darwin
      # Writes an image onto a RAM disk through /dev/rdiskN and reads it back. Not a gate until it has
      # been seen to pass once, hence continue-on-error.
      - name: Flash a RAM disk and verify
        continue-on-error: true
        run: |
          set -eux
          dev=$(hdiutil attach -nomount ram://131072 | awk '{print $1}')   # 64 MiB
          head -c 33554432 /dev/urandom > "$RUNNER_TEMP/test.img"
          sudo ./target/debug/nyforge list --all
          sudo ./target/debug/nyforge flash "$RUNNER_TEMP/test.img" "$dev" --allow-virtual --allow-internal -y
          raw=$(echo "$dev" | sed 's#/dev/disk#/dev/rdisk#')
          sudo dd if="$raw" of="$RUNNER_TEMP/back.img" bs=1m count=32
          cmp "$RUNNER_TEMP/test.img" "$RUNNER_TEMP/back.img"
          hdiutil detach "$dev"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p nyforge -p nyforge-gui
      - run: cargo test --locked -p nyforge-core -p nyforge
      - run: target\release\nyforge.exe --version
      - name: Drive detection on real Windows
        shell: pwsh
        run: |
          target\release\nyforge.exe doctor
          target\release\nyforge.exe list --all
          target\release\nyforge.exe list --all --json
      # Attaches a 64 MiB virtual disk, flashes an image onto \\.\PhysicalDriveN and reads it back.
      # Not a gate until it has been seen to pass once, hence continue-on-error.
      - name: Flash a virtual disk and verify
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vhd = Join-Path $env:RUNNER_TEMP 'test.vhd'
          $dp = Join-Path $env:RUNNER_TEMP 'dp.txt'
          @("create vdisk file=`"$vhd`" maximum=64 type=fixed", "select vdisk file=`"$vhd`"", "attach vdisk") | Set-Content $dp -Encoding ascii
          diskpart /s $dp
          $n = (Get-DiskImage -ImagePath $vhd | Get-Disk).Number
          $img = Join-Path $env:RUNNER_TEMP 'test.img'
          $bytes = New-Object byte[] 33554432
          (New-Object System.Random 42).NextBytes($bytes)
          [IO.File]::WriteAllBytes($img, $bytes)
          target\release\nyforge.exe flash $img "\\.\PhysicalDrive$n" --allow-virtual --allow-internal -y
          if ($LASTEXITCODE -ne 0) { throw "flash failed" }
          $fs = [IO.File]::Open("\\.\PhysicalDrive$n", 'Open', 'Read', 'ReadWrite')
          $buf = New-Object byte[] 33554432
          $got = 0
          while ($got -lt $buf.Length) { $r = $fs.Read($buf, $got, $buf.Length - $got); if ($r -le 0) { break }; $got += $r }
          $fs.Close()
          $a = (Get-FileHash $img -Algorithm SHA256).Hash
          $b = (Get-FileHash -InputStream (New-Object IO.MemoryStream (, $buf)) -Algorithm SHA256).Hash
          if ($a -ne $b) { throw "read-back differs: $a vs $b" }
          "read-back identical"

  # The portable Linux builds users will download. Compiled with Zig's linker so the glibc builds run on
  # every distro back to glibc 2.17 (2014); the musl builds are fully static (Alpine, containers).
  linux-portable:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: "x86_64-unknown-linux-gnu.2.17", triple: x86_64-unknown-linux-gnu, qemu: "" }
          - { target: "aarch64-unknown-linux-gnu.2.17", triple: aarch64-unknown-linux-gnu, qemu: "qemu-aarch64 -L /usr/aarch64-linux-gnu" }
          - { target: "x86_64-unknown-linux-musl", triple: x86_64-unknown-linux-musl, qemu: "" }
          - { target: "aarch64-unknown-linux-musl", triple: aarch64-unknown-linux-musl, qemu: "qemu-aarch64" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.triple }}" }
      - run: pip install ziglang cargo-zigbuild
      - run: sudo apt-get update && sudo apt-get install -y qemu-user libc6-arm64-cross
      - run: cargo zigbuild --locked --release -p nyforge --target ${{ matrix.target }}
      - name: The binary starts
        run: |
          ${{ matrix.qemu }} target/${{ matrix.triple }}/release/nyforge --version
          ${{ matrix.qemu }} target/${{ matrix.triple }}/release/nyforge doctor || true
      - name: Needs no newer glibc than 2.17
        if: contains(matrix.target, 'gnu')
        run: |
          max=$(objdump -T target/${{ matrix.triple }}/release/nyforge | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol: $max"
          [ "$(printf '%s\n' "$max" GLIBC_2.17 | sort -V | tail -1)" = GLIBC_2.17 ]
