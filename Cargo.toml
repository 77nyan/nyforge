[workspace]
resolver = "2"
members = ["crates/nyforge-core", "crates/nyforge-cli", "crates/nyforge-gui"]
default-members = ["crates/nyforge-core", "crates/nyforge-cli", "crates/nyforge-gui"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["NyForge contributors"]
repository = "https://github.com/77nyan/nyforge"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
debug = 0

[profile.test]
opt-level = 2
debug = 0

# fatfs 0.3.6 writes long-name entries for "." and "..", producing directories that
# fsck.vfat rejects. vendor/fatfs is the upstream crate (MIT) with that one fix.
[patch.crates-io]
fatfs = { path = "vendor/fatfs" }
