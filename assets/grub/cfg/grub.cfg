# ---------------------------------------------------------------------------
# NyBoot menu (shipped by NyForge — it is rewritten when you update NyBoot).
# Your own settings go in  /nyboot/nyboot.cfg  on the NYBOOT partition.
# ---------------------------------------------------------------------------

set nb_esp="$root"
regexp --set=1:nb_disk '^([^,]+),' "$root"
regexp --set=1:nb_scheme '^[^,]+,([a-z]+)[0-9]+' "$root"
set nb_data="${nb_disk},${nb_scheme}1"

# Defaults (override in nyboot.cfg).
set nb_timeout=-1
set nb_dryrun=""
set nb_default=""
set nb_maxdepth="xxxx"

# A test hook, only present on drives built by NyForge's own test-suite.
if [ -f "($nb_esp)/grub/test.cfg" ]; then
  source "($nb_esp)/grub/test.cfg"
fi
if [ -f "($nb_data)/nyboot/nyboot.cfg" ]; then
  source "($nb_data)/nyboot/nyboot.cfg"
fi

source "($nb_esp)/grub/profiles.cfg"

# ---- screen -----------------------------------------------------------------
# nyboot.cfg can set  nb_text=1  (plain text menu), nb_theme=off  (graphics, no theme),
# nb_theme=NAME  (your own theme from /nyboot/themes/NAME/ on the data partition),
# nb_gfxmode=WIDTHxHEIGHT  (try this screen mode first) and nb_ui=large|xlarge  (bigger
# text and rows, for 1440p / 4K screens). GRUB takes the first mode in the list that the
# screen has; 1080p comes first because it is available on nearly every screen and is the
# size the theme is drawn for.
set nb_themed=""
if [ -z "$nb_text" ]; then
  insmod all_video
  insmod gfxterm
  if loadfont "($nb_esp)/grub/unicode.pf2"; then
    set gfxmode="1920x1080,1366x768,1280x720,1024x768,auto"
    if [ -n "$nb_gfxmode" ]; then
      set gfxmode="$nb_gfxmode,1920x1080,1366x768,1280x720,1024x768,auto"
    fi
    set gfxpayload=keep
    terminal_output gfxterm
    set nb_tier=""
    if [ "$nb_ui" = "large" -o "$nb_gfxmode" = "2560x1440" ]; then
      set nb_tier="-large"
    elif [ "$nb_ui" = "xlarge" -o "$nb_gfxmode" = "3840x2160" ]; then
      set nb_tier="-xlarge"
    fi
    # A theme of your own: nb_theme="name" uses the GRUB 2 theme in /nyboot/themes/name/ on the data partition
    # (its theme.txt plus any .pf2 fonts and images next to it). Without one, or when it is missing, the built-in
    # theme is used. nb_theme=off shows the plain menu on a graphics screen.
    set nb_themefile=""
    set nb_themedir=""
    if [ -n "$nb_theme" -a "$nb_theme" != "off" ]; then
      if [ -f "($nb_data)/nyboot/themes/$nb_theme/theme.txt" ]; then
        set nb_themedir="($nb_data)/nyboot/themes/$nb_theme"
        set nb_themefile="$nb_themedir/theme.txt"
      fi
    fi
    if [ -z "$nb_themefile" -a "$nb_theme" != "off" -a -f "($nb_esp)/grub/themes/nyboot/theme${nb_tier}.txt" ]; then
      set nb_themedir="($nb_esp)/grub/themes/nyboot"
      set nb_themefile="$nb_themedir/theme${nb_tier}.txt"
    fi
    if [ -n "$nb_themefile" ]; then
      insmod png
      insmod jpeg
      insmod tga
      insmod gfxmenu
      for nb_ft in "$nb_themedir"/*.pf2; do
        if [ -f "$nb_ft" ]; then
          loadfont "$nb_ft"
        fi
      done
      set theme="$nb_themefile"
      set nb_themed="y"
    fi
  fi
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan
set timeout=$nb_timeout

# ---- find ISOs --------------------------------------------------------------
set nb_found=""

function nb_scan {
  # $1 = folder, $2 = depth marker
  for nb_f in "$1"/*; do
    if [ -d "$nb_f" ]; then
      if regexp '/(System Volume Information|\$RECYCLE\.BIN|nyboot|\.[^/]*)$' "$nb_f"; then
        true
      elif [ "$2" != "$nb_maxdepth" ]; then
        nb_scan "$nb_f" "${2}x"
      fi
    elif regexp '\.[iI][sS][oO]$' "$nb_f"; then
      regexp --set=1:nb_name '([^/]*)\.[iI][sS][oO]$' "$nb_f"
      set nb_found="y"
      if [ -n "$nb_each_iso" ]; then
        $nb_each_iso "$nb_f"
      fi
      menuentry "$nb_name" --class iso "$nb_f" {
        nb_boot "$2"
      }
    fi
  done
}

if [ -z "$nb_data_missing" ]; then
  nb_scan "($nb_data)" "x"
fi

# Preselect the entry the user chose (by name, from nyboot.cfg) when it exists.
if [ -n "$nb_default" ]; then
  set default="$nb_default"
fi

# ---- always-there entries ---------------------------------------------------
# Memtest86+ (GPL-2, shipped unmodified in grub/memtest/). The .bin files are started like a
# Linux kernel on BIOS; the .efi files like one on UEFI. 32-bit firmware / CPUs get the ia32 build.
function nb_memtest {
  set nb_mt=""
  if [ "$grub_platform" = "efi" ]; then
    if [ "$grub_cpu" = "x86_64" ]; then
      set nb_mt="memtest86+x64.efi"
    else
      set nb_mt="memtest86+ia32.efi"
    fi
  else
    # Memtest86+ wants the text screen on BIOS.
    set gfxpayload=text
    if cpuid -l; then
      set nb_mt="memtest86+x64.bin"
    else
      set nb_mt="memtest86+ia32.bin"
    fi
  fi
  if [ ! -f "($nb_esp)/grub/memtest/$nb_mt" ]; then
    echo "Memtest86+ is not on this drive. Run 'nyforge boot update' to add it."
    sleep 5
    return
  fi
  linux "($nb_esp)/grub/memtest/$nb_mt"
  boot
}

if [ "$grub_platform" = "efi" ]; then
  menuentry "UEFI Firmware Settings" --class settings {
    fwsetup
  }
fi
menuentry "Memtest86+" --class memtest {
  nb_memtest
}
menuentry "Shutdown" --class shutdown {
  halt
}

# Automated tests only: pick an entry and report. Never set on a normal drive.
if [ -n "$nb_autopick" ]; then
  nb_autopick_run
fi
