# ---------------------------------------------------------------------------
# NyBoot menu (shipped by NyForge — it is rewritten when you update NyBoot).
# Your own settings go in  /nyboot/nyboot.cfg  on the NYBOOT partition.
# ---------------------------------------------------------------------------

set nb_esp="$root"
regexp --set=1:nb_disk '^([^,]+),' "$root"
regexp --set=1:nb_scheme '^[^,]+,([a-z]+)[0-9]+' "$root"
set nb_data="${nb_disk},${nb_scheme}1"

# Defaults (override in nyboot.cfg).
set nb_timeout=-1
set nb_dryrun=""
set nb_maxdepth="xxxx"

# A test hook, only present on drives built by NyForge's own test-suite.
if [ -f "($nb_esp)/grub/test.cfg" ]; then
  source "($nb_esp)/grub/test.cfg"
fi
if [ -f "($nb_data)/nyboot/nyboot.cfg" ]; then
  source "($nb_data)/nyboot/nyboot.cfg"
fi

source "($nb_esp)/grub/profiles.cfg"

# ---- screen -----------------------------------------------------------------
if [ -z "$nb_text" ]; then
  insmod all_video
  insmod gfxterm
  if loadfont "($nb_esp)/grub/unicode.pf2"; then
    set gfxmode=auto
    set gfxpayload=keep
    terminal_output gfxterm
  fi
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan
set timeout=$nb_timeout

# ---- find ISOs --------------------------------------------------------------
set nb_found=""

function nb_scan {
  # $1 = folder, $2 = depth marker
  for nb_f in "$1"/*; do
    if [ -d "$nb_f" ]; then
      if regexp '/(System Volume Information|\$RECYCLE\.BIN|nyboot|\.[^/]*)$' "$nb_f"; then
        true
      elif [ "$2" != "$nb_maxdepth" ]; then
        nb_scan "$nb_f" "${2}x"
      fi
    elif regexp '\.[iI][sS][oO]$' "$nb_f"; then
      regexp --set=1:nb_name '([^/]*)\.[iI][sS][oO]$' "$nb_f"
      set nb_found="y"
      if [ -n "$nb_each_iso" ]; then
        $nb_each_iso "$nb_f"
      fi
      menuentry "$nb_name" --class iso "$nb_f" {
        nb_boot "$2"
      }
    fi
  done
}

if [ -z "$nb_data_missing" ]; then
  nb_scan "($nb_data)" "x"
fi

if [ -z "$nb_found" ]; then
  menuentry "No ISO files found - copy .iso files onto the NYBOOT drive, then restart" --class info {
    echo "Copy .iso files onto the NYBOOT partition (any folder), then restart."
    sleep 5
  }
fi

# ---- always-there entries ---------------------------------------------------
if [ "$grub_platform" = "efi" ]; then
  menuentry "UEFI firmware settings" --class settings {
    fwsetup
  }
fi
menuentry "Restart" --class restart {
  reboot
}
menuentry "Shut down" --class shutdown {
  halt
}

# Automated tests only: pick an entry and report. Never set on a normal drive.
if [ -n "$nb_autopick" ]; then
  nb_autopick_run
fi
