# How to start each kind of ISO. Everything here is best-effort knowledge of how
# the common live/installer images find themselves again when they sit as a
# FILE on a partition instead of in a CD drive.
#
# nb_dryrun=1 prints the commands (prefixed NBX:) instead of running them; the
# test-suite uses that to check the decisions without needing real kernels.

# Dry-run printing: the command on one line, then one argument per line, so that the
# serial console's line wrapping cannot make the output ambiguous.
function nb_dry {
  echo "NBX: $1"
  shift
  for nb_a in "$@"; do
    echo "NBX-A: $nb_a"
  done
}

function nb_say {
  if [ -n "$nb_dryrun" ]; then
    nb_dry "$@"
  fi
}

function nb_linux {
  if [ -n "$nb_dryrun" ]; then
    nb_dry linux "$@"
  else
    linux "$@"
  fi
}

function nb_initrd {
  if [ -n "$nb_dryrun" ]; then
    nb_dry initrd "$@"
  else
    initrd "$@"
  fi
}

function nb_go {
  if [ -n "$nb_dryrun" ]; then
    nb_dry boot
  else
    boot
  fi
}

function nb_first_file {
  # sets nb_ff to the first existing file among the arguments, or ""
  set nb_ff=""
  for nb_c in "$@"; do
    if [ -f "$nb_c" ]; then
      set nb_ff="$nb_c"
      break
    fi
  done
}

function nb_fail {
  echo "NyBoot: $@"
  echo "Press any key to return to the menu."
  if [ -z "$nb_dryrun" ]; then
    sleep -i 6
  fi
}

# ----------------------------------------------------------------------------

function nb_boot {
  set nb_iso="$1"
  regexp --set=1:nb_isorel '^\([^)]*\)(.*)$' "$nb_iso"
  set nb_profile=""
  set nb_params=""

  # Per-ISO tweaks, e.g.  ubuntu.iso.nyboot.cfg  containing:  set nb_params="nomodeset"
  if [ -f "${nb_iso}.nyboot.cfg" ]; then
    source "${nb_iso}.nyboot.cfg"
  fi

  nb_say iso "$nb_isorel"
  loopback loop "$nb_iso"
  if [ -z "$nb_profile" ]; then
    nb_detect
  fi
  nb_say profile "$nb_profile"

  if   [ "$nb_profile" = "loopbackcfg" ]; then nb_p_loopbackcfg
  elif [ "$nb_profile" = "casper" ];      then nb_p_casper
  elif [ "$nb_profile" = "debian-live" ]; then nb_p_debian_live
  elif [ "$nb_profile" = "archiso" ];     then nb_p_archiso
  elif [ "$nb_profile" = "manjaro" ];     then nb_p_manjaro
  elif [ "$nb_profile" = "dracut-live" ]; then nb_p_dracut_live
  elif [ "$nb_profile" = "grubcfg" ];     then nb_p_grubcfg
  elif [ "$nb_profile" = "generic" ];     then nb_p_generic
  elif [ "$nb_profile" = "windows" ];     then nb_fail "This is a Windows installer. Use 'nyforge windows' to make Windows install media; Windows ISOs cannot start from a multiboot drive."
  else
    nb_fail "NyBoot does not know how to start this ISO yet ($nb_isorel)."
  fi
  loopback -d loop
}

function nb_detect {
  nb_find_archiso
  # Arch-family images come first: their own loopback.cfg runs `search --file`, which makes GRUB probe every partition
  # of every disk in the computer (slow, sometimes minutes); we already know where the ISO is.
  if   [ -n "$nb_abase" ];                                then set nb_profile="archiso"
  elif [ -f (loop)/boot/grub/loopback.cfg ];              then set nb_profile="loopbackcfg"
  elif [ -d (loop)/casper ];                              then set nb_profile="casper"
  elif [ -f (loop)/boot/vmlinuz-x86_64 -a -d (loop)/manjaro ]; then set nb_profile="manjaro"
  elif [ -d (loop)/live -a -f (loop)/.disk/info ];        then set nb_profile="debian-live"
  elif [ -d (loop)/live ];                                then set nb_profile="debian-live"
  elif [ -f (loop)/images/pxeboot/vmlinuz ];              then set nb_profile="dracut-live"
  elif [ -f (loop)/sources/boot.wim -o -f (loop)/sources/install.wim -o -f (loop)/sources/install.esd ]; then set nb_profile="windows"
  elif [ -f (loop)/boot/grub/grub.cfg ];                  then set nb_profile="grubcfg"
  else
    nb_find_generic
    if [ -n "$nb_gk" ]; then set nb_profile="generic"; fi
  fi
}

# Arch-family live images (Arch, EndeavourOS, CachyOS, Garuda, SystemRescue ...): the kernel lives in
# <basedir>/boot/x86_64/ and is not always called vmlinuz-linux (CachyOS: vmlinuz-linux-cachyos).
# Sets nb_abase (the folder name), nb_ak (kernel) and nb_ai (initramfs), or leaves nb_abase empty.
function nb_find_archiso {
  set nb_abase=""
  set nb_ak=""
  set nb_ai=""
  for nb_d in (loop)/*; do
    if [ -z "$nb_abase" -a -d "$nb_d" ]; then
      set nb_ak=""
      if [ -f "$nb_d/boot/x86_64/vmlinuz-linux" ]; then
        set nb_ak="$nb_d/boot/x86_64/vmlinuz-linux"
        set nb_ai="$nb_d/boot/x86_64/initramfs-linux.img"
      else
        for nb_c in "$nb_d"/boot/x86_64/vmlinuz*; do
          if [ -z "$nb_ak" -a -f "$nb_c" ]; then
            regexp --set=1:nb_sfx '/vmlinuz([^/]*)$' "$nb_c"
            if [ -f "$nb_d/boot/x86_64/initramfs${nb_sfx}.img" ]; then
              set nb_ak="$nb_c"
              set nb_ai="$nb_d/boot/x86_64/initramfs${nb_sfx}.img"
            fi
          fi
        done
        if [ -z "$nb_ak" -a -d "$nb_d/x86_64" ]; then
          # SystemRescue and friends: one kernel, an initramfs with its own name, archiso's x86_64/ folder beside it
          for nb_c in "$nb_d"/boot/x86_64/vmlinuz*; do
            if [ -z "$nb_ak" -a -f "$nb_c" ]; then
              for nb_j in "$nb_d"/boot/x86_64/*.img; do
                if [ -z "$nb_ai" -a -f "$nb_j" ]; then
                  if regexp 'ucode' "$nb_j"; then
                    true
                  else
                    set nb_ai="$nb_j"
                  fi
                fi
              done
              if [ -n "$nb_ai" ]; then set nb_ak="$nb_c"; fi
            fi
          done
        fi
      fi
      if [ -n "$nb_ak" ]; then
        regexp --set=1:nb_abase '/([^/]*)$' "$nb_d"
        set nb_adir="$nb_d"
      fi
    fi
  done
}

# Any kernel + initramfs pair in the usual places, for images nothing else recognised.
# Sets nb_gk and nb_gi, or leaves nb_gk empty.
function nb_find_generic {
  set nb_gk=""
  set nb_gi=""
  set nb_gdirs="(loop) (loop)/boot (loop)/isolinux (loop)/syslinux (loop)/boot/syslinux"
  for nb_d in (loop)/*; do
    if [ -d "$nb_d" ]; then
      set nb_gdirs="$nb_gdirs $nb_d $nb_d/boot $nb_d/boot/x86_64 $nb_d/x86_64"
    fi
  done
  for nb_dir in $nb_gdirs; do
    if [ -z "$nb_gk" -a -d "$nb_dir" ]; then
      set nb_tk=""
      set nb_ti=""
      for nb_c in "$nb_dir"/vmlinuz* "$nb_dir"/bzImage*; do
        if [ -z "$nb_tk" -a -f "$nb_c" ]; then
          if regexp '\.(sig|efi)$' "$nb_c"; then
            true
          else
            set nb_tk="$nb_c"
          fi
        fi
      done
      for nb_c in "$nb_dir"/initrd* "$nb_dir"/initramfs*; do
        if [ -z "$nb_ti" -a -f "$nb_c" ]; then set nb_ti="$nb_c"; fi
      done
      if [ -n "$nb_tk" -a -n "$nb_ti" ]; then
        set nb_gk="$nb_tk"
        set nb_gi="$nb_ti"
      fi
    fi
  done
}

# ---- profiles ---------------------------------------------------------------

function nb_p_loopbackcfg {
  # The distro ships its own loopback menu (Ubuntu and friends): hand over to it.
  nb_say configfile "(loop)/boot/grub/loopback.cfg" "iso_path=$nb_isorel"
  if [ -z "$nb_dryrun" ]; then
    set iso_path="$nb_isorel"
    export iso_path
    set nb_saved_root="$root"
    set root=(loop)
    configfile /boot/grub/loopback.cfg
    set root="$nb_saved_root"
  fi
}

function nb_p_casper {
  nb_first_file (loop)/casper/vmlinuz (loop)/casper/vmlinuz.efi (loop)/casper/vmlinuz-generic
  set nb_k="$nb_ff"
  nb_first_file (loop)/casper/initrd (loop)/casper/initrd.lz (loop)/casper/initrd.gz (loop)/casper/initrd.img
  set nb_i="$nb_ff"
  if [ -z "$nb_k" -o -z "$nb_i" ]; then nb_fail "Could not find the kernel in this Ubuntu-style image."; return; fi
  nb_linux "$nb_k" boot=casper iso-scan/filename="$nb_isorel" $nb_params quiet splash ---
  nb_initrd "$nb_i"
  nb_go
}

function nb_p_debian_live {
  set nb_k=""
  set nb_i=""
  for nb_c in (loop)/live/vmlinuz*; do
    if [ -f "$nb_c" ]; then set nb_k="$nb_c"; fi
  done
  for nb_c in (loop)/live/initrd*; do
    if [ -f "$nb_c" ]; then set nb_i="$nb_c"; fi
  done
  if [ -z "$nb_k" -o -z "$nb_i" ]; then nb_fail "Could not find the kernel in this Debian-live image."; return; fi
  nb_linux "$nb_k" boot=live findiso="$nb_isorel" components $nb_params quiet splash
  nb_initrd "$nb_i"
  nb_go
}

function nb_p_archiso {
  probe -u --set=nb_uuid "($nb_data)"
  if [ -z "$nb_abase" ]; then nb_find_archiso; fi
  if [ -z "$nb_abase" ]; then nb_fail "Could not find the kernel in this Arch-style image."; return; fi
  set nb_ucode=""
  for nb_c in "$nb_adir"/boot/intel_ucode.img "$nb_adir"/boot/amd_ucode.img "$nb_adir"/boot/x86_64/intel-ucode.img "$nb_adir"/boot/x86_64/amd-ucode.img; do
    if [ -f "$nb_c" ]; then set nb_ucode="$nb_ucode $nb_c"; fi
  done
  set nb_extra=""
  if regexp 'cachyos' "$nb_ak"; then
    # what CachyOS's own menu passes: room for the installer's changes, and the usual graphics/NVMe settings
    set nb_extra="cow_spacesize=10G nvme_load=yes module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1"
  fi
  nb_linux "$nb_ak" archisobasedir="$nb_abase" img_dev=/dev/disk/by-uuid/$nb_uuid img_loop="$nb_isorel" $nb_extra $nb_params
  nb_initrd $nb_ucode "$nb_ai"
  nb_go
}

function nb_p_manjaro {
  probe -u --set=nb_uuid "($nb_data)"
  probe -l --set=nb_label "(loop)"
  nb_linux (loop)/boot/vmlinuz-x86_64 misobasedir=manjaro misolabel="$nb_label" img_dev=/dev/disk/by-uuid/$nb_uuid img_loop="$nb_isorel" $nb_params quiet
  nb_initrd (loop)/boot/initramfs-x86_64.img
  nb_go
}

function nb_p_dracut_live {
  probe -l --set=nb_label "(loop)"
  set nb_i="(loop)/images/pxeboot/initrd.img"
  nb_linux (loop)/images/pxeboot/vmlinuz root=live:CDLABEL="$nb_label" rd.live.image iso-scan/filename="$nb_isorel" $nb_params quiet
  nb_initrd "$nb_i"
  nb_go
}

function nb_p_grubcfg {
  # Last resort for images with a GRUB config of their own: let it run with the ISO as root.
  nb_say configfile "(loop)/boot/grub/grub.cfg"
  if [ -z "$nb_dryrun" ]; then
    set nb_saved_root="$root"
    set root=(loop)
    configfile /boot/grub/grub.cfg
    set root="$nb_saved_root"
  fi
}

function nb_p_generic {
  # Unknown family: give the kernel every loop-boot hint the common initramfs scripts understand.
  # Options a given initramfs does not know are ignored by it.
  probe -u --set=nb_uuid "($nb_data)"
  probe -l --set=nb_label "(loop)"
  if [ -z "$nb_gk" ]; then nb_find_generic; fi
  if [ -z "$nb_gk" ]; then nb_fail "Could not find a kernel and initramfs in this image."; return; fi
  nb_linux "$nb_gk" iso-scan/filename="$nb_isorel" findiso="$nb_isorel" fromiso="$nb_isorel" img_dev=/dev/disk/by-uuid/$nb_uuid img_loop="$nb_isorel" isoloop="$nb_isorel" root=live:CDLABEL="$nb_label" rd.live.image $nb_params
  nb_initrd "$nb_gi"
  nb_go
}
